# Nginx reverse proxy for the dashboard.
# Install to: /etc/nginx/sites-available/devops-dashboard
# Then:       sudo ln -s /etc/nginx/sites-available/devops-dashboard /etc/nginx/sites-enabled/
#
# Replace dashboard.example.com with your domain. Certbot (see docs/DEPLOYMENT.md)
# will add the HTTPS (listen 443) block and the HTTP->HTTPS redirect for you.

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    # Don't advertise the Nginx version.
    server_tokens off;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Overwrite (don't append) so clients can't spoof their IP in activity logs.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Long-lived caching for Next.js's fingerprinted static assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
